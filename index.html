<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Multi-Character Roleplay &amp; Story Playground</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #0e0f13;
      --panel: rgba(28, 30, 38, 0.55);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #7c8cff;
      --accent-2: #b07cff;
      --text: #e7e9f0;
      --muted: #8a8fa3;
      --online: #34d399;
    }
    html, body { height: 100%; }
    body {
      background: radial-gradient(1200px 600px at 10% -10%, #1d2140 0%, transparent 60%),
                  radial-gradient(900px 500px at 110% 110%, #2a1640 0%, transparent 60%),
                  var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .glass {
      background: var(--panel);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      border: 1px solid var(--border);
    }
    .scrollbar::-webkit-scrollbar { width: 6px; }
    .scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 6px; }

    /* ----- Roleplay parser styles ----- */
    .dialogue { font-family: "Inter", system-ui, sans-serif; letter-spacing: .01em; }
    .action {
      font-style: italic;
      color: #c9b8ff;
      background: rgba(176, 124, 255, 0.12);
      border: 1px solid rgba(176, 124, 255, 0.22);
      padding: 1px 8px;
      border-radius: 999px;
      margin: 0 2px;
      display: inline;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    /* ----- Animations ----- */
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(14px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .msg-in { animation: msgIn .35s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fadeIn .2s ease both; }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(12px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }
    .modal-in { animation: modalIn .25s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes pulseDot {
      0%, 80%, 100% { transform: scale(.6); opacity: .35; }
      40%           { transform: scale(1);  opacity: 1; }
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; animation: pulseDot 1.2s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes onlinePulse {
      0% { box-shadow: 0 0 0 0 rgba(52,211,153,.6); }
      70% { box-shadow: 0 0 0 7px rgba(52,211,153,0); }
      100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
    }
    .online-dot { animation: onlinePulse 2s infinite; }
    .char-item { transition: background .2s ease, transform .2s ease; }
    .char-item:hover { transform: translateX(2px); }
    .btn { transition: transform .15s ease, background .2s ease, box-shadow .2s ease, opacity .2s; }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(.98); }
    .grad-btn { background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 20px -6px rgba(124,140,255,.6); }
    .grad-btn:hover { box-shadow: 0 10px 28px -6px rgba(124,140,255,.75); }
    textarea, input { outline: none; }
    textarea:focus, input:focus { border-color: rgba(124,140,255,.6) !important; box-shadow: 0 0 0 3px rgba(124,140,255,.15); }
    .avatar-ring { box-shadow: 0 0 0 2px rgba(124,140,255,.35); }
    .bubble-ai { border-top-left-radius: 6px; }
    .bubble-user { border-top-right-radius: 6px; background: linear-gradient(135deg, #5b6cff, #8f5cff); }
    .msg-text { white-space: pre-wrap; word-wrap: break-word; line-height: 1.6; }
    .sidebar-hidden { transform: translateX(-100%); }
    @media (min-width: 768px) { .sidebar-hidden { transform: none; } }
  </style>
</head>
<body class="h-full overflow-hidden">

<div class="h-full flex flex-col">

  <!-- ===== Top bar ===== -->
  <header class="glass h-14 flex items-center justify-between px-4 z-30 shrink-0">
    <div class="flex items-center gap-3">
      <button id="toggleSidebar" class="btn md:hidden p-2 rounded-lg hover:bg-white/10" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="w-8 h-8 rounded-xl grad-btn flex items-center justify-center font-bold text-white">R</div>
      <div>
        <h1 class="text-sm font-semibold leading-tight">Roleplay Playground</h1>
        <p class="text-[11px] text-[var(--muted)] leading-tight">Powered by NVIDIA NIM</p>
      </div>
    </div>
    <button id="openSettings" class="btn glass rounded-xl px-3 py-2 text-sm flex items-center gap-2 hover:bg-white/10">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
      <span id="keyBadge" class="w-2 h-2 rounded-full bg-red-400" title="API key status"></span>
    </button>
  </header>

  <div class="flex flex-1 min-h-0 relative">

    <!-- ===== Sidebar ===== -->
    <aside id="sidebar" class="glass sidebar-hidden md:transform-none fixed md:static inset-y-14 left-0 w-72 max-w-[85%] z-20 flex flex-col transition-transform duration-300 border-r">
      <div class="p-4">
        <button id="newCharBtn" class="btn grad-btn w-full rounded-xl py-2.5 text-sm font-semibold text-white">+ Create Character</button>
      </div>
      <div class="px-4 pb-2 text-[11px] uppercase tracking-wider text-[var(--muted)]">Characters</div>
      <div id="charList" class="flex-1 overflow-y-auto scrollbar px-2 pb-4 space-y-1"></div>
    </aside>
    <div id="backdrop" class="hidden fixed inset-0 top-14 bg-black/50 z-10 md:hidden"></div>

    <!-- ===== Chat area ===== -->
    <main class="flex-1 flex flex-col min-w-0">
      <!-- Chat header -->
      <div id="chatHeader" class="glass border-b flex items-center justify-between px-4 py-3 shrink-0">
        <div class="flex items-center gap-3 min-w-0">
          <div class="relative shrink-0">
            <img id="hdrAvatar" class="w-10 h-10 rounded-full object-cover avatar-ring bg-white/5" alt="" />
            <span class="online-dot absolute bottom-0 right-0 w-3 h-3 rounded-full bg-[var(--online)] border-2 border-[#15161c]"></span>
          </div>
          <div class="min-w-0">
            <div id="hdrName" class="font-semibold truncate">No character selected</div>
            <div class="text-xs text-[var(--online)]">online</div>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="clearChatBtn" class="btn glass rounded-lg px-3 py-1.5 text-xs hover:bg-white/10 disabled:opacity-40" disabled>Clear Chat</button>
          <button id="editCharBtn" class="btn glass rounded-lg px-3 py-1.5 text-xs hover:bg-white/10 disabled:opacity-40" disabled>Edit</button>
        </div>
      </div>

      <!-- Messages -->
      <div id="messages" class="flex-1 overflow-y-auto scrollbar px-4 md:px-8 py-6 space-y-4"></div>

      <!-- Composer -->
      <div class="glass border-t p-3 md:p-4 shrink-0">
        <div class="max-w-4xl mx-auto flex items-end gap-2">
          <textarea id="input" rows="1" placeholder="Type a message… use *asterisks* for actions"
            class="flex-1 resize-none rounded-2xl bg-white/5 border border-white/10 px-4 py-3 text-sm max-h-40 scrollbar placeholder:text-[var(--muted)] transition"
            disabled></textarea>
          <button id="sendBtn" class="btn grad-btn rounded-2xl px-5 py-3 text-sm font-semibold text-white disabled:opacity-40 disabled:shadow-none" disabled>Send</button>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ===== Settings Modal ===== -->
<div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm fade-in flex items-center justify-center p-4">
  <div class="glass modal-in rounded-2xl w-full max-w-md p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold">Settings</h2>
      <button data-close class="btn p-1.5 rounded-lg hover:bg-white/10" aria-label="Close">✕</button>
    </div>
    <label class="text-xs text-[var(--muted)]">NVIDIA NIM API Key</label>
    <div class="flex gap-2 mt-1">
      <input id="apiKeyInput" type="password" placeholder="nvapi-..." autocomplete="off"
        class="flex-1 rounded-xl bg-white/5 border border-white/10 px-3 py-2.5 text-sm" />
      <button id="toggleKeyVis" class="btn glass rounded-xl px-3 text-xs hover:bg-white/10">Show</button>
    </div>
    <p class="text-[11px] text-[var(--muted)] mt-2 leading-relaxed">
      Stored only in your browser's LocalStorage. Requests go to
      <code class="text-[#c9b8ff]">integrate.api.nvidia.com</code> with model
      <code class="text-[#c9b8ff]">meta/llama-3.1-70b-instruct</code>.
    </p>
    <div class="flex justify-between items-center mt-6">
      <button id="clearKeyBtn" class="btn text-xs text-red-300 hover:text-red-200">Remove key</button>
      <button id="saveKeyBtn" class="btn grad-btn rounded-xl px-5 py-2 text-sm font-semibold text-white">Save</button>
    </div>
  </div>
</div>

<!-- ===== Character Modal ===== -->
<div id="charModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm fade-in flex items-center justify-center p-4">
  <div class="glass modal-in rounded-2xl w-full max-w-2xl max-h-[92vh] flex flex-col">
    <div class="flex items-center justify-between px-6 pt-5 pb-3 border-b border-white/5">
      <h2 id="charModalTitle" class="text-lg font-semibold">Create Character</h2>
      <button data-close class="btn p-1.5 rounded-lg hover:bg-white/10" aria-label="Close">✕</button>
    </div>

    <form id="charForm" class="flex-1 overflow-y-auto scrollbar px-6 py-5 space-y-5">
      <!-- Avatar -->
      <div class="flex flex-col sm:flex-row gap-5">
        <div class="flex flex-col items-center gap-2">
          <img id="previewAvatar" class="w-24 h-24 rounded-full object-cover avatar-ring bg-white/5" alt="Avatar preview" />
          <span class="text-[11px] text-[var(--muted)]">Live preview</span>
        </div>
        <div class="flex-1 space-y-3">
          <div class="flex gap-2 text-xs">
            <button type="button" data-mode="file" class="avatarMode btn px-3 py-1.5 rounded-lg glass">Upload file</button>
            <button type="button" data-mode="url" class="avatarMode btn px-3 py-1.5 rounded-lg glass">Image URL</button>
          </div>
          <input id="avatarFile" type="file" accept="image/*" class="hidden" />
          <div id="avatarFileWrap">
            <button type="button" id="pickFileBtn" class="btn w-full rounded-xl border border-dashed border-white/20 py-3 text-sm text-[var(--muted)] hover:bg-white/5">
              Choose an image from device (max 2 MB)
            </button>
          </div>
          <div id="avatarUrlWrap" class="hidden">
            <input id="avatarUrl" type="url" placeholder="https://example.com/photo.jpg"
              class="w-full rounded-xl bg-white/5 border border-white/10 px-3 py-2.5 text-sm" />
          </div>
          <input type="hidden" id="avatarData" />
        </div>
      </div>

      <div>
        <label class="text-xs text-[var(--muted)]">Character Name</label>
        <input id="charName" required maxlength="60" placeholder="e.g. Riya"
          class="mt-1 w-full rounded-xl bg-white/5 border border-white/10 px-3 py-2.5 text-sm transition" />
      </div>

      <div>
        <label class="text-xs text-[var(--muted)]">System Prompt (personality, behavior, language, roleplay rules)</label>
        <textarea id="charPrompt" rows="8" required maxlength="6000"
          placeholder="You are Riya, a warm and playful friend. Always reply in Hinglish. Stay in character. Use *asterisks* for actions..."
          class="mt-1 w-full rounded-xl bg-white/5 border border-white/10 px-3 py-2.5 text-sm scrollbar transition"></textarea>
      </div>

      <div>
        <label class="text-xs text-[var(--muted)]">Initial Greeting Message</label>
        <textarea id="charGreeting" rows="3" maxlength="1000"
          placeholder="*waves from across the room* Hey! Kaise ho?"
          class="mt-1 w-full rounded-xl bg-white/5 border border-white/10 px-3 py-2.5 text-sm scrollbar transition"></textarea>
      </div>

      <p id="charError" class="hidden text-xs text-red-300"></p>
    </form>

    <div class="flex justify-end gap-2 px-6 py-4 border-t border-white/5">
      <button type="button" data-close class="btn glass rounded-xl px-4 py-2 text-sm hover:bg-white/10">Cancel</button>
      <button type="submit" form="charForm" class="btn grad-btn rounded-xl px-5 py-2 text-sm font-semibold text-white">Save Character</button>
    </div>
  </div>
</div>

<!-- ===== Toast ===== -->
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 glass rounded-xl px-4 py-2.5 text-sm z-[60] fade-in"></div>

<script>
(() => {
  "use strict";

  // ---------- Config ----------
  const API_URL = "https://integrate.api.nvidia.com/v1/chat/completions";
  const MODEL = "meta/llama-3.1-70b-instruct";
  const MAX_HISTORY = 30;          // messages sent to the API per request
  const MAX_AVATAR_BYTES = 2 * 1024 * 1024;
  const KEYS = { chars: "rp.characters", chats: "rp.chats", active: "rp.activeId", apiKey: "rp.apiKey" };

  // ---------- Storage (every access guarded) ----------
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
      catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch { toast("Storage is full. Try a smaller avatar image."); return false; }
    },
    remove(key) { try { localStorage.removeItem(key); } catch {} }
  };

  // ---------- State ----------
  let characters = store.get(KEYS.chars, []);   // [{id,name,avatar,systemPrompt,greeting}]
  let chats = store.get(KEYS.chats, {});        // { [charId]: [{id,role,content,ts}] }
  let activeId = store.get(KEYS.active, null);
  let apiKey = store.get(KEYS.apiKey, "");
  let editingId = null;                          // null = create mode
  let sending = false;
  let animatedIds = new Set();                  // messages already animated

  const $ = (id) => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const save = {
    chars: () => store.set(KEYS.chars, characters),
    chats: () => store.set(KEYS.chats, chats),
    active: () => store.set(KEYS.active, activeId),
    key: () => store.set(KEYS.apiKey, apiKey)
  };

  // ---------- Helpers ----------
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Roleplay parser: *action* -> highlighted pill, rest -> clean dialogue.
  // Escapes HTML first so user/AI text can never inject markup.
  function parseRoleplay(text) {
    return escapeHtml(text)
      .replace(/\*([^*\n]+?)\*/g, '<span class="action">$1</span>');
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.remove("hidden");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.add("hidden"), 2600);
  }

  function initialsAvatar(name) {
    const letter = (name || "?").trim().charAt(0).toUpperCase() || "?";
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8cff"/><stop offset="1" stop-color="#b07cff"/></linearGradient></defs><rect width="128" height="128" fill="url(#g)"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="58" fill="white">${letter}</text></svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }
  const avatarOf = (c) => c && c.avatar ? c.avatar : initialsAvatar(c && c.name);
  const getChar = (id) => characters.find(c => c.id === id);
  const activeChar = () => getChar(activeId);

  function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  // ---------- Settings ----------
  function refreshKeyBadge() {
    $("keyBadge").className = "w-2 h-2 rounded-full " + (apiKey ? "bg-[var(--online)]" : "bg-red-400");
    $("keyBadge").title = apiKey ? "API key saved" : "API key missing";
  }
  function openModal(id) { $(id).classList.remove("hidden"); }
  function closeModal(id) { $(id).classList.add("hidden"); }

  $("openSettings").onclick = () => { $("apiKeyInput").value = apiKey; openModal("settingsModal"); };
  $("toggleKeyVis").onclick = (e) => {
    const inp = $("apiKeyInput");
    inp.type = inp.type === "password" ? "text" : "password";
    e.target.textContent = inp.type === "password" ? "Show" : "Hide";
  };
  $("saveKeyBtn").onclick = () => {
    apiKey = $("apiKeyInput").value.trim();
    save.key(); refreshKeyBadge(); closeModal("settingsModal");
    toast(apiKey ? "API key saved" : "API key cleared");
  };
  $("clearKeyBtn").onclick = () => {
    apiKey = ""; store.remove(KEYS.apiKey);
    $("apiKeyInput").value = ""; refreshKeyBadge(); toast("API key removed");
  };

  // ---------- Sidebar ----------
  function renderSidebar() {
    const list = $("charList");
    list.innerHTML = "";
    if (!characters.length) {
      list.innerHTML = `<p class="text-xs text-[var(--muted)] px-3 py-6 text-center">No characters yet.<br/>Create one to start roleplaying.</p>`;
      return;
    }
    characters.forEach((c, i) => {
      const chat = chats[c.id] || [];
      const last = chat[chat.length - 1];
      const preview = last ? last.content.replace(/\*/g, "").slice(0, 40) : "Start a conversation";
      const item = document.createElement("button");
      item.className = `char-item w-full flex items-center gap-3 p-2.5 rounded-xl text-left ${c.id === activeId ? "bg-white/10" : "hover:bg-white/5"} fade-in`;
      item.style.animationDelay = `${i * 40}ms`;
      item.innerHTML = `
        <img src="${avatarOf(c)}" class="w-11 h-11 rounded-full object-cover shrink-0 bg-white/5" alt="" />
        <div class="min-w-0 flex-1">
          <div class="text-sm font-medium truncate">${escapeHtml(c.name)}</div>
          <div class="text-xs text-[var(--muted)] truncate">${escapeHtml(preview)}</div>
        </div>`;
      item.onclick = () => { selectCharacter(c.id); closeSidebarOnMobile(); };
      list.appendChild(item);
    });
  }

  function closeSidebarOnMobile() {
    if (window.innerWidth < 768) { $("sidebar").classList.add("sidebar-hidden"); $("backdrop").classList.add("hidden"); }
  }
  function toggleSidebar(force) {
    const sb = $("sidebar");
    const hidden = force !== undefined ? !force : !sb.classList.contains("sidebar-hidden");
    sb.classList.toggle("sidebar-hidden", hidden);
    $("backdrop").classList.toggle("hidden", hidden);
  }
  $("toggleSidebar").onclick = () => toggleSidebar();
  $("backdrop").onclick = () => toggleSidebar(false);

  // ---------- Chat ----------
  function selectCharacter(id) {
    activeId = id; save.active();
    animatedIds = new Set((chats[id] || []).map(m => m.id)); // don't re-animate old messages
    ensureGreeting(id);
    renderAll(true);
  }

  // Put the greeting into history once, if the chat is empty.
  function ensureGreeting(id) {
    const c = getChar(id);
    if (!c) return;
    if (!chats[id] || chats[id].length === 0) {
      chats[id] = c.greeting ? [{ id: uid(), role: "assistant", content: c.greeting, ts: Date.now() }] : [];
      save.chats();
    }
  }

  function renderHeader() {
    const c = activeChar();
    $("hdrAvatar").src = avatarOf(c);
    $("hdrName").textContent = c ? c.name : "No character selected";
    $("editCharBtn").disabled = !c;
    $("clearChatBtn").disabled = !c;
    $("input").disabled = !c;
    $("sendBtn").disabled = !c || sending;
    $("input").placeholder = c ? `Message ${c.name}… use *asterisks* for actions` : "Create or select a character to start";
  }

  function renderMessages(scrollToEnd = true) {
    const box = $("messages");
    const c = activeChar();
    box.innerHTML = "";
    if (!c) {
      box.innerHTML = `
        <div class="h-full flex flex-col items-center justify-center text-center fade-in">
          <div class="w-20 h-20 rounded-3xl grad-btn flex items-center justify-center text-3xl font-bold text-white mb-5">R</div>
          <h2 class="text-xl font-semibold">Welcome to the Playground</h2>
          <p class="text-sm text-[var(--muted)] mt-2 max-w-sm">Create a character from the sidebar, give it a personality, and start a story. Don't forget to add your NVIDIA API key in Settings.</p>
        </div>`;
      return;
    }
    const msgs = chats[c.id] || [];
    msgs.forEach(m => {
      const isUser = m.role === "user";
      const row = document.createElement("div");
      row.className = `flex items-end gap-2 ${isUser ? "justify-end" : "justify-start"} ${animatedIds.has(m.id) ? "" : "msg-in"}`;
      const avatar = isUser ? "" : `<img src="${avatarOf(c)}" class="w-8 h-8 rounded-full object-cover shrink-0 avatar-ring" alt="" />`;
      const bubbleClass = isUser
        ? "bubble-user text-white"
        : "glass bubble-ai text-[var(--text)]";
      row.innerHTML = `
        ${avatar}
        <div class="max-w-[80%] md:max-w-[65%] rounded-2xl px-4 py-3 shadow-lg ${bubbleClass}">
          <div class="msg-text dialogue text-[15px]">${parseRoleplay(m.content)}</div>
          <div class="text-[10px] opacity-50 mt-1 ${isUser ? "text-right" : ""}">${new Date(m.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</div>
        </div>`;
      box.appendChild(row);
      animatedIds.add(m.id);
    });
    if (sending) box.appendChild(typingIndicator(c));
    if (scrollToEnd) box.scrollTop = box.scrollHeight;
  }

  function typingIndicator(c) {
    const row = document.createElement("div");
    row.id = "typing";
    row.className = "flex items-end gap-2 justify-start msg-in";
    row.innerHTML = `
      <img src="${avatarOf(c)}" class="w-8 h-8 rounded-full object-cover shrink-0 avatar-ring" alt="" />
      <div class="glass bubble-ai rounded-2xl px-4 py-3 flex items-center gap-1.5">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>`;
    return row;
  }

  function renderAll(scroll) {
    renderHeader();
    renderSidebar();
    renderMessages(scroll);
  }

  // ---------- Send / API ----------
  function buildPayload(c) {
    const history = (chats[c.id] || []).slice(-MAX_HISTORY).map(m => ({ role: m.role, content: m.content }));
    const system = (c.systemPrompt || "You are a helpful roleplay character.") +
      "\n\nRules: Stay in character at all times. Put actions, expressions and feelings inside *asterisks*. " +
      "Keep dialogue natural and concise.";
    return {
      model: MODEL,
      messages: [{ role: "system", content: system }, ...history],
      temperature: 0.85,
      top_p: 0.95,
      max_tokens: 700,
      stream: false
    };
  }

  async function sendMessage() {
    const c = activeChar();
    const text = $("input").value.trim();
    if (!c || !text || sending) return;
    if (!apiKey) { toast("Add your NVIDIA API key in Settings first."); openModal("settingsModal"); return; }

    const userMsg = { id: uid(), role: "user", content: text, ts: Date.now() };
    chats[c.id] = [...(chats[c.id] || []), userMsg];
    save.chats();
    $("input").value = ""; autoGrow();
    sending = true; renderHeader(); renderMessages(true);

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
        body: JSON.stringify(buildPayload(c))
      });
      if (!res.ok) {
        let detail = "";
        try { detail = (await res.json()).error?.message || ""; } catch {}
        throw new Error(`API ${res.status}${detail ? ": " + detail : ""}`);
      }
      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content?.trim();
      if (!reply) throw new Error("Empty response from model.");
      chats[c.id] = [...chats[c.id], { id: uid(), role: "assistant", content: reply, ts: Date.now() }];
      save.chats();
    } catch (err) {
      chats[c.id] = [...chats[c.id], { id: uid(), role: "assistant", content: `⚠️ ${err.message}`, ts: Date.now(), error: true }];
      save.chats();
      toast("Request failed. See the message in chat.");
    } finally {
      sending = false;
      renderHeader();
      renderMessages(true);
      renderSidebar();
      $("input").focus();
    }
  }

  function autoGrow() {
    const t = $("input");
    t.style.height = "auto";
    t.style.height = Math.min(t.scrollHeight, 160) + "px";
  }
  $("input").addEventListener("input", autoGrow);
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  $("sendBtn").onclick = sendMessage;

  $("clearChatBtn").onclick = () => {
    const c = activeChar();
    if (!c || !confirm(`Clear chat history with ${c.name}?`)) return;
    chats[c.id] = [];
    ensureGreeting(c.id);
    animatedIds = new Set();
    renderAll(true);
    toast("Chat reset");
  };

  // ---------- Character modal (create / edit) ----------
  let avatarMode = "file";
  let pendingAvatar = "";     // data URL or http URL currently in the form

  function setAvatarMode(mode) {
    avatarMode = mode;
    document.querySelectorAll(".avatarMode").forEach(b => b.classList.toggle("bg-white/15", b.dataset.mode === mode));
    $("avatarFileWrap").classList.toggle("hidden", mode !== "file");
    $("avatarUrlWrap").classList.toggle("hidden", mode !== "url");
  }
  function updatePreview(name) {
    $("previewAvatar").src = pendingAvatar || initialsAvatar(name);
  }

  function openCharModal(id = null) {
    editingId = id;
    const c = getChar(id);
    $("charModalTitle").textContent = c ? "Edit Character" : "Create Character";
    $("charName").value = c ? c.name : "";
    $("charPrompt").value = c ? c.systemPrompt : "";
    $("charGreeting").value = c ? c.greeting || "" : "";
    $("charError").classList.add("hidden");
    pendingAvatar = c ? c.avatar || "" : "";
    $("avatarUrl").value = c && c.avatar && /^https?:/.test(c.avatar) ? c.avatar : "";
    $("avatarFile").value = "";
    setAvatarMode(c && c.avatar && /^https?:/.test(c.avatar) ? "url" : "file");
    updatePreview($("charName").value);
    openModal("charModal");
    setTimeout(() => $("charName").focus(), 50);
  }

  $("newCharBtn").onclick = () => openCharModal(null);
  $("editCharBtn").onclick = () => activeChar() && openCharModal(activeId);
  document.querySelectorAll(".avatarMode").forEach(b => b.onclick = () => setAvatarMode(b.dataset.mode));
  $("pickFileBtn").onclick = () => $("avatarFile").click();

  $("avatarFile").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) return toast("Please choose an image file.");
    if (file.size > MAX_AVATAR_BYTES) return toast("Image must be 2 MB or smaller.");
    pendingAvatar = await readFileAsDataURL(file);   // Base64 data URL
    updatePreview($("charName").value);
  });

  let urlTimer;
  $("avatarUrl").addEventListener("input", (e) => {
    clearTimeout(urlTimer);
    urlTimer = setTimeout(() => {
      const v = e.target.value.trim();
      pendingAvatar = /^https?:\/\//.test(v) ? v : "";
      updatePreview($("charName").value);
    }, 300);
  });

  $("charName").addEventListener("input", (e) => {
    if (!pendingAvatar) updatePreview(e.target.value);
  });

  $("charForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("charName").value.trim();
    const systemPrompt = $("charPrompt").value.trim();
    const greeting = $("charGreeting").value.trim();
    const err = $("charError");
    if (!name || !systemPrompt) {
      err.textContent = "Name and system prompt are required.";
      err.classList.remove("hidden");
      return;
    }

    if (editingId) {
      // Edit: update profile only; chat history stays intact.
      const c = getChar(editingId);
      Object.assign(c, { name, systemPrompt, greeting, avatar: pendingAvatar });
      save.chars();
      toast("Character updated");
    } else {
      const c = { id: uid(), name, systemPrompt, greeting, avatar: pendingAvatar };
      characters.push(c);
      save.chars();
      activeId = c.id; save.active();
      ensureGreeting(c.id);
      animatedIds = new Set();
      toast(`${name} created`);
    }
    closeModal("charModal");
    renderAll(true);
  });

  // ---------- Generic modal close ----------
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", (e) => {
    closeModal(e.target.closest(".fixed").id);
  }));
  document.querySelectorAll(".fixed[id$='Modal']").forEach(m => m.addEventListener("click", (e) => {
    if (e.target === m) closeModal(m.id);
  }));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") ["settingsModal", "charModal"].forEach(closeModal);
  });

  // ---------- Init ----------
  function init() {
    // Drop any chats belonging to deleted/unknown characters
    const ids = new Set(characters.map(c => c.id));
    Object.keys(chats).forEach(k => { if (!ids.has(k)) delete chats[k]; });
    if (activeId && !ids.has(activeId)) activeId = null;
    if (!activeId && characters.length) activeId = characters[0].id;
    if (activeId) ensureGreeting(activeId);
    refreshKeyBadge();
    $("apiKeyInput").value = apiKey;
    renderAll(false);
  }
  init();
})();
</script>
</body>
</html>
